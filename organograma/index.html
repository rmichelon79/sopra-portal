<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organograma — Sopra</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../sopra-ui.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* Estilos específicos do Organograma (tokens + genéricos vêm do kit sopra-ui.css) */
  .btn.danger{color:var(--risk);border-color:var(--risk);background:var(--card)}  /* danger em contorno (override do kit) */
  /* app */
  header{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:10}
  header .brand{display:flex;align-items:center;gap:9px;font-weight:700}
  header .dot{width:12px;height:12px;border-radius:3px;background:var(--ok)}
  .toolbar{display:flex;gap:8px;align-items:center;padding:12px 22px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:#fff}
  .who{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
  .canvas{padding:30px 20px 60px;overflow:auto}
  /* org tree (CSS puro) */
  .tree{display:inline-block;min-width:100%}
  .tree ul{padding-top:22px;position:relative;display:flex;justify-content:center;margin:0}
  .tree li{list-style:none;text-align:center;position:relative;padding:22px 10px 0}
  .tree li::before,.tree li::after{content:'';position:absolute;top:0;right:50%;border-top:2px solid var(--line);width:50%;height:22px}
  .tree li::after{right:auto;left:50%;border-left:2px solid var(--line)}
  .tree li:only-child::before,.tree li:only-child::after{display:none}
  .tree li:only-child{padding-top:0}
  .tree li:first-child::before,.tree li:last-child::after{border:0 none}
  .tree li:last-child::before{border-right:2px solid var(--line);border-radius:0 6px 0 0}
  .tree li:first-child::after{border-radius:6px 0 0 0}
  .tree ul ul::before{content:'';position:absolute;top:0;left:50%;border-left:2px solid var(--line);width:0;height:22px}
  .node{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;width:172px;height:194px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px;cursor:pointer;transition:.12s;text-align:center;overflow:hidden}
  .node:hover{border-color:var(--ink)}
  .node.sel{border-color:var(--ok);box-shadow:0 0 0 3px rgba(122,164,54,.22)}
  .node .avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;margin:0 auto 7px;display:block;border:2px solid var(--line);background:#f0ede6}
  .node .avatar.ph{display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;color:var(--muted)}
  .mfoto{width:52px;height:52px;border-radius:50%;object-fit:cover;border:1px solid var(--line);background:#f0ede6;flex-shrink:0}
  .mfoto.ph{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
  .node .n{font-weight:600;font-size:13px;line-height:1.2;max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .node .c{font-size:11px;color:var(--muted);margin-top:2px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .node .a{font-size:10px;color:var(--verde);margin-top:2px;text-transform:uppercase;letter-spacing:.4px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .empty{text-align:center;color:var(--muted);padding:70px 20px}
  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:24px}
  .modal{background:#fff;border-radius:16px;padding:26px;width:100%;max-width:420px;border:1px solid var(--line)}
  .modal h3{margin:0 0 16px;font-size:20px}
  @media print{
    header,.toolbar,.no-print{display:none!important}
    .canvas{padding:0;overflow:visible}
    body{background:#fff}
    .node{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
  /* ── Custos (admin) ── */
  .admin-only{align-items:center;gap:6px}
  .node .cost-badge{position:absolute;left:0;right:0;bottom:0;background:#EEF0DC;color:#3E571A;font-size:11px;font-weight:700;text-align:center;padding:3px 4px;border-top:1px solid #d9e0c4}
  .cst-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
  .cst-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:0 1px 2px rgba(34,31,26,.04)}
  .cst-card .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .cst-card .v{font-family:'DM Serif Display',serif;font-size:22px;margin-top:3px}
  .cst-card .s{font-size:12px;color:var(--muted)}
  .cst-sec-title{font-size:13px;font-weight:700;margin:22px 0 8px;color:var(--ink)}
  .cst-tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
  table.cst{border-collapse:collapse;width:100%;font-size:12.5px;min-width:1040px}
  table.cst th{background:var(--paper);text-align:left;padding:8px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-bottom:1px solid var(--line-2);white-space:nowrap}
  table.cst td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  table.cst td.num,table.cst th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  table.cst tr:hover td{background:var(--paper)}
  table.cst input,table.cst select{font-family:inherit;font-size:12.5px;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;width:100%;color:var(--ink)}
  table.cst input:focus,table.cst select:focus{outline:none;border-color:var(--ok);background:var(--card)}
  table.cst input.rem{text-align:right;max-width:110px}
  table.cst .ro{color:var(--muted)}
  table.cst tr.tot td{font-weight:700;background:#000;color:#fff;border-bottom:0}
  .cst-prem{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 4px}
  .cst-prem .pit{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:12px}
  .cst-prem .pit input{width:52px;text-align:right;border:1px solid var(--line-2);border-radius:6px;padding:2px 5px;font-family:inherit}
  .cst-resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
  table.rsm{border-collapse:collapse;width:100%;font-size:12px}
  table.rsm th,table.rsm td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  table.rsm th:first-child,table.rsm td:first-child{text-align:left}
  table.rsm thead th{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}
  table.rsm tr.rt td{font-weight:700;border-top:1px solid var(--line-2)}
  .cst-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 2px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="authView" class="auth-wrap hidden">
  <form class="auth" id="loginForm">
    <img class="auth-logo" src="../sopra-logo.png" alt="Sopra Incorporadora" style="height:32px;margin:0 auto 12px">
    <h2 class="serif" style="font-size:20px;text-align:center">Organograma</h2>
    <p class="sub">Entre com sua conta corporativa.</p>
    <div class="field"><label>E-mail</label><input type="email" id="email" autocomplete="email" required></div>
    <div class="field"><label>Senha</label><input type="password" id="password" autocomplete="current-password" required></div>
    <div class="err" id="loginErr"></div>
    <button class="btn primary" type="submit" style="width:100%" id="loginBtn">Entrar</button>
  </form>
</div>

<!-- APP -->
<div id="appView" class="hidden">
  <header>
    <div class="brand"><img class="brand-logo" src="../sopra-logo.png" alt="Sopra"><span class="serif" style="font-size:18px">Organograma</span></div>
    <div class="who">
      <span id="whoName"></span>
      <button class="btn" onclick="location.href='https://rmichelon79.github.io/sopra-portal/'" title="Voltar ao Portal (continua logado)">⌂ Portal</button>
      <button class="btn" id="logoutBtn">Sair</button>
    </div>
  </header>
  <div class="toolbar">
    <span class="admin-only" id="viewSwitch" style="display:none">
      <button class="btn primary" id="btn-view-org">Organograma</button>
      <button class="btn" id="btn-view-cst">Custos</button>
      <span style="width:1px;height:22px;background:var(--line);margin:0 4px"></span>
    </span>
    <button class="btn primary edit-only" id="btn-add-topo">+ Cargo (topo)</button>
    <button class="btn edit-only" id="btn-add-sub" disabled>+ Subordinado</button>
    <button class="btn edit-only" id="btn-edit" disabled>Editar</button>
    <button class="btn danger edit-only" id="btn-del" disabled>Excluir</button>
    <button class="btn edit-only" id="btn-left" disabled title="Mover para a esquerda">◀</button>
    <button class="btn edit-only" id="btn-right" disabled title="Mover para a direita">▶</button>
    <span style="width:1px;height:22px;background:var(--line);margin:0 4px"></span>
    <button class="btn" id="btn-png">↓ Exportar PNG</button>
    <label class="admin-only" id="costToggleWrap" style="display:none;font-size:13px;color:var(--muted);cursor:pointer"><input type="checkbox" id="costToggle"> custos nas caixas</label>
    <span id="hint" style="font-size:12px;color:var(--muted)">Clique num cargo para selecioná-lo.</span>
  </div>
  <div class="canvas" id="orgCanvas"><div id="chart"></div></div>
  <div id="custosView" style="display:none;padding:0 22px 48px"></div>
</div>

<div id="bootView" class="empty">Carregando…</div>

<!-- MODAL -->
<div id="modalBg" class="modal-bg hidden">
  <div class="modal">
    <h3 id="modalTitle">Novo cargo</h3>
    <div class="field"><label>Nome</label><input id="m-nome" placeholder="Nome da pessoa"></div>
    <div class="field"><label>Cargo</label><input id="m-cargo" placeholder="Ex: Diretor Comercial"></div>
    <div class="field"><label>Área</label><input id="m-area" placeholder="Ex: Comercial"></div>
    <div class="field"><label>Foto</label>
      <div style="display:flex;align-items:center;gap:12px">
        <img id="m-foto-img" class="mfoto" style="display:none" alt="">
        <div id="m-foto-ph" class="mfoto ph">sem foto</div>
        <input type="file" id="m-foto-file" accept="image/*" style="flex:1;font-size:13px">
        <button type="button" class="btn" id="m-foto-rm" style="display:none">Remover</button>
      </div>
    </div>
    <div class="field"><label>Reporta a</label><select id="m-parent"></select></div>
    <div class="err" id="m-err"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn" id="m-cancel">Cancelar</button>
      <button class="btn primary" id="m-save">Salvar</button>
    </div>
  </div>
</div>

<script>
const SB_URL = 'https://cgnuelmiacweybmvlbcm.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNnbnVlbG1pYWN3ZXlibXZsYmNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyMDM0ODMsImV4cCI6MjA5Mjc3OTQ4M30.l02F-jt6CSgZf7wd5Dz0IY6jB9gCLzM6Iny7EsZLNSw';
const SBC = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const show = v => { ['authView', 'appView', 'bootView'].forEach(x => $(x).classList.add('hidden')); $(v).classList.remove('hidden'); };

let SESSION = null;
let NODES = [];
let selId = null;
let modalMode = null; // 'novo' | 'novoSub' | 'editar'
let mFoto = null;     // data URL da foto no modal (ou null)
let VIEW = 'org', CUSTOS = [], PREMISSAS = {}, SHOWCOST = false, custosErr = null; // análise de custos (admin)

// Redimensiona a imagem escolhida para ~128px (base64 leve)
function resizeImage(file, max = 128) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        res(c.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = rej; img.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}
function setFotoPreview() {
  if (mFoto) { $('m-foto-img').src = mFoto; $('m-foto-img').style.display = ''; $('m-foto-ph').style.display = 'none'; $('m-foto-rm').style.display = ''; }
  else { $('m-foto-img').style.display = 'none'; $('m-foto-ph').style.display = ''; $('m-foto-rm').style.display = 'none'; }
}
$('m-foto-file').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try { mFoto = await resizeImage(f); setFotoPreview(); }
  catch { $('m-err').textContent = 'Não foi possível ler a imagem.'; }
  e.target.value = '';
});
$('m-foto-rm').addEventListener('click', () => { mFoto = null; setFotoPreview(); });

// ── AUTH ──
async function loadSession(user) {
  try {
    const [{ data: prof }, { data: acc }] = await Promise.all([
      SBC.from('profiles').select('nome,role').eq('id', user.id).maybeSingle(),
      SBC.from('app_access').select('can_view,can_edit').eq('app', 'organograma').maybeSingle(),
    ]);
    const role = (prof && prof.role) || 'viewer';
    const isAdmin = role === 'admin';
    if (!(isAdmin || (acc && acc.can_view === true))) return false;
    SESSION = { nome: (prof && prof.nome) || user.email, role, canEdit: isAdmin || (acc && acc.can_edit === true) };
    return true;
  } catch (e) { console.warn('loadSession', e); return false; }
}

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('loginErr').textContent = ''; $('loginBtn').textContent = 'Entrando…'; $('loginBtn').disabled = true;
  const { data, error } = await SBC.auth.signInWithPassword({ email: $('email').value.trim().toLowerCase(), password: $('password').value });
  $('loginBtn').textContent = 'Entrar'; $('loginBtn').disabled = false;
  if (error) { $('loginErr').textContent = 'E-mail ou senha incorretos.'; return; }
  if (!(await loadSession(data.user))) { $('loginErr').textContent = 'Você não tem acesso ao Organograma.'; await SBC.auth.signOut(); return; }
  startApp();
});
$('logoutBtn').addEventListener('click', async () => { await SBC.auth.signOut(); location.href = 'https://rmichelon79.github.io/sopra-portal/'; });

async function startApp() {
  $('whoName').textContent = SESSION.nome;
  const admin = SESSION.role === 'admin';
  document.querySelectorAll('.edit-only').forEach(el => { el.style.display = SESSION.canEdit ? '' : 'none'; });
  document.querySelectorAll('.admin-only').forEach(el => { el.style.display = admin ? 'inline-flex' : 'none'; });
  show('appView');
  await carregar();
  if (admin) { try { await carregarCustos(); } catch (e) { console.warn('custos', e); } }
  setView('org');
}

// ── DADOS ──
async function carregar() {
  const { data, error } = await SBC.from('org_nodes').select('*').order('ordem').order('nome');
  if (error) { $('chart').innerHTML = `<div class="empty">Erro: ${esc(error.message)}</div>`; return; }
  NODES = data || [];
  render();
}

// ── ÁRVORE ──
function filhosDe(pid) { return NODES.filter(n => n.parent_id === pid); }
function descendentes(id, acc = new Set()) {
  filhosDe(id).forEach(f => { acc.add(f.id); descendentes(f.id, acc); });
  return acc;
}
function iniciais(nome) {
  return (nome || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase() || '?';
}
function nodeInner(n) {
  const av = n.foto ? `<img class="avatar" src="${n.foto}" alt="">` : `<div class="avatar ph">${esc(iniciais(n.nome))}</div>`;
  return `${av}<div class="n">${esc(n.nome)}</div>${n.cargo ? `<div class="c">${esc(n.cargo)}</div>` : ''}${n.area ? `<div class="a">${esc(n.area)}</div>` : ''}`;
}
const byOrder = (a, b) => (a.ordem - b.ordem) || (a.nome || '').localeCompare(b.nome || '');
const NODE_W = 172, NODE_H = 194, GAP_X = 30, GAP_Y = 56;
// Layout tidy-tree: folhas em sequência; cada pai centralizado sobre 1º e último filho.
function layout() {
  const pos = {}; let leafX = 0;
  function place(node, depth) {
    const filhos = NODES.filter(n => n.parent_id === node.id).sort(byOrder);
    const y = depth * (NODE_H + GAP_Y);
    let x;
    if (!filhos.length) { x = leafX * (NODE_W + GAP_X); leafX++; }
    else { const xs = filhos.map(f => place(f, depth + 1)); x = (xs[0] + xs[xs.length - 1]) / 2; }
    pos[node.id] = { x, y };
    return x;
  }
  NODES.filter(n => n.parent_id === null).sort(byOrder).forEach(r => place(r, 0));
  return pos;
}
function render() {
  const chart = $('chart');
  if (!(selId && NODES.some(n => n.id === selId))) selId = null;
  if (!NODES.length) {
    chart.innerHTML = `<div class="empty">Nenhum cargo ainda.${SESSION.canEdit ? ' Clique em <b>+ Cargo (topo)</b> para começar.' : ''}</div>`;
  } else {
    const pos = layout();
    let maxX = 0, maxY = 0;
    Object.values(pos).forEach(p => { if (p.x > maxX) maxX = p.x; if (p.y > maxY) maxY = p.y; });
    const W = maxX + NODE_W, H = maxY + NODE_H;
    let lines = '';
    NODES.forEach(n => {
      if (!n.parent_id || !pos[n.parent_id] || !pos[n.id]) return;
      const p = pos[n.parent_id], c = pos[n.id];
      const pcx = p.x + NODE_W / 2, pby = p.y + NODE_H, ccx = c.x + NODE_W / 2, cty = c.y, midY = pby + GAP_Y / 2;
      lines += `<polyline points="${pcx},${pby} ${pcx},${midY} ${ccx},${midY} ${ccx},${cty}" fill="none" stroke="#c9c3b6" stroke-width="2"/>`;
    });
    const admin = SESSION && SESSION.role === 'admin';
    const cm = {};
    if (admin && SHOWCOST) CUSTOS.forEach(r => { if (r.node_id) cm[r.node_id] = (cm[r.node_id] || 0) + calcRow(r).mes; });
    const nodes = NODES.map(n => {
      const p = pos[n.id]; if (!p) return '';
      const badge = (admin && SHOWCOST && cm[n.id]) ? `<div class="cost-badge" title="${money0(cm[n.id] * 12)}/ano">${money0(cm[n.id])}/mês</div>` : '';
      return `<div class="node${n.id === selId ? ' sel' : ''}" data-id="${n.id}" style="position:absolute;left:${p.x}px;top:${p.y}px">${nodeInner(n)}${badge}</div>`;
    }).join('');
    chart.innerHTML = `<div style="position:relative;width:${W}px;height:${H}px;margin:0 auto">
      <svg width="${W}" height="${H}" style="position:absolute;left:0;top:0;pointer-events:none">${lines}</svg>${nodes}</div>`;
    chart.querySelectorAll('.node').forEach(el => el.addEventListener('click', () => { selId = el.dataset.id; render(); }));
  }
  const temSel = !!selId && NODES.some(n => n.id === selId);
  ['btn-add-sub', 'btn-edit', 'btn-del', 'btn-left', 'btn-right'].forEach(b => { const el = $(b); if (el) el.disabled = !temSel; });
}

// ── MODAL ──
function opcoesParent(excluir = new Set()) {
  const opts = ['<option value="">— (topo, sem superior)</option>'];
  NODES.filter(n => !excluir.has(n.id)).forEach(n => {
    opts.push(`<option value="${n.id}">${esc(n.nome)}${n.cargo ? ' — ' + esc(n.cargo) : ''}</option>`);
  });
  return opts.join('');
}
function abrirModal(mode) {
  modalMode = mode;
  $('m-err').textContent = '';
  const sel = NODES.find(n => n.id === selId);
  if (mode === 'editar') {
    $('modalTitle').textContent = 'Editar cargo';
    const excl = descendentes(sel.id); excl.add(sel.id); // evita ciclo
    $('m-parent').innerHTML = opcoesParent(excl);
    $('m-nome').value = sel.nome || ''; $('m-cargo').value = sel.cargo || ''; $('m-area').value = sel.area || '';
    $('m-parent').value = sel.parent_id || '';
  } else {
    $('modalTitle').textContent = mode === 'novoSub' ? `Novo subordinado de ${sel.nome}` : 'Novo cargo';
    $('m-parent').innerHTML = opcoesParent();
    $('m-nome').value = ''; $('m-cargo').value = ''; $('m-area').value = '';
    $('m-parent').value = mode === 'novoSub' ? sel.id : '';
  }
  mFoto = mode === 'editar' ? (sel.foto || null) : null;
  setFotoPreview();
  $('modalBg').classList.remove('hidden');
  $('m-nome').focus();
}
$('m-cancel').addEventListener('click', () => $('modalBg').classList.add('hidden'));
$('m-save').addEventListener('click', async () => {
  const nome = $('m-nome').value.trim();
  if (!nome) { $('m-err').textContent = 'Nome é obrigatório.'; return; }
  const payload = { nome, cargo: $('m-cargo').value.trim() || null, area: $('m-area').value.trim() || null, parent_id: $('m-parent').value || null, foto: mFoto };

// Reordena a pessoa selecionada entre os irmãos (mesmo superior)
async function moverSel(dir) {
  const sel = NODES.find(n => n.id === selId); if (!sel) return;
  const byOrder = (a, b) => (a.ordem - b.ordem) || (a.nome || '').localeCompare(b.nome || '');
  const irmaos = NODES.filter(n => n.parent_id === sel.parent_id).sort(byOrder);
  const i = irmaos.findIndex(n => n.id === sel.id), j = i + dir;
  if (j < 0 || j >= irmaos.length) return;
  const arr = irmaos.slice();
  [arr[i], arr[j]] = [arr[j], arr[i]];
  // normaliza a ordem (0..n-1) e grava só quem mudou
  for (let k = 0; k < arr.length; k++) {
    if (arr[k].ordem !== k) {
      const { error } = await SBC.from('org_nodes').update({ ordem: k }).eq('id', arr[k].id);
      if (error) { alert(error.message); return; }
    }
  }
  await carregar();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function ellipsize(ctx, text, maxW) {
  if (ctx.measureText(text).width <= maxW) return text;
  let s = text;
  while (s.length && ctx.measureText(s + '…').width > maxW) s = s.slice(0, -1);
  return s + '…';
}
function drawClamp(ctx, text, cx, y, maxW, lh, maxLines) {
  const words = String(text).split(/\s+/); const lines = []; let cur = '';
  for (const w of words) { const test = cur ? cur + ' ' + w : w; if (ctx.measureText(test).width <= maxW || !cur) cur = test; else { lines.push(cur); cur = w; } }
  if (cur) lines.push(cur);
  if (lines.length > maxLines) { lines.length = maxLines; lines[maxLines - 1] = ellipsize(ctx, lines[maxLines - 1], maxW); }
  lines.forEach((ln, i) => ctx.fillText(ln, cx, y + i * lh));
  return y + lines.length * lh;
}
function drawCard(ctx, n, x, y, img) {
  const cx = x + NODE_W / 2;
  roundRect(ctx, x, y, NODE_W, NODE_H, 12); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.strokeStyle = '#e6e1d8'; ctx.lineWidth = 1; ctx.stroke();
  const av = 96, ay = y + 12, ar = av / 2, acy = ay + ar;
  ctx.save(); ctx.beginPath(); ctx.arc(cx, acy, ar, 0, Math.PI * 2); ctx.closePath();
  ctx.fillStyle = '#f0ede6'; ctx.fill();
  if (img) { ctx.clip(); ctx.drawImage(img, cx - ar, ay, av, av); }
  ctx.restore();
  ctx.beginPath(); ctx.arc(cx, acy, ar, 0, Math.PI * 2); ctx.strokeStyle = '#e6e1d8'; ctx.lineWidth = 2; ctx.stroke();
  if (!img) { ctx.fillStyle = '#8a857c'; ctx.font = "700 30px 'DM Sans',sans-serif"; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(iniciais(n.nome), cx, acy); }
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  let ty = ay + av + 8;
  ctx.fillStyle = '#23211C'; ctx.font = "600 13px 'DM Sans',sans-serif";
  ty = drawClamp(ctx, n.nome, cx, ty, NODE_W - 20, 16, 2) + 2;
  if (n.cargo) { ctx.fillStyle = '#8a857c'; ctx.font = "400 11px 'DM Sans',sans-serif"; ctx.fillText(ellipsize(ctx, n.cargo, NODE_W - 20), cx, ty); ty += 15; }
  if (n.area) { ctx.fillStyle = '#1D9E75'; ctx.font = "600 10px 'DM Sans',sans-serif"; ctx.fillText(ellipsize(ctx, n.area.toUpperCase(), NODE_W - 20), cx, ty + 1); }
}
async function exportarPNG() {
  if (!NODES.length) { alert('Nada para exportar.'); return; }
  const btn = $('btn-png'); const t = btn.textContent; btn.textContent = 'Gerando…'; btn.disabled = true;
  try {
    try { await document.fonts.ready; } catch (_) {}
    const pos = layout();
    let maxX = 0, maxY = 0;
    Object.values(pos).forEach(p => { if (p.x > maxX) maxX = p.x; if (p.y > maxY) maxY = p.y; });
    const W = maxX + NODE_W, H = maxY + NODE_H, pad = 28, scale = 2;
    const cv = document.createElement('canvas');
    cv.width = (W + pad * 2) * scale; cv.height = (H + pad * 2) * scale;
    const ctx = cv.getContext('2d');
    ctx.scale(scale, scale); ctx.translate(pad, pad);
    ctx.fillStyle = '#F7F5F0'; ctx.fillRect(-pad, -pad, W + pad * 2, H + pad * 2);
    ctx.strokeStyle = '#c9c3b6'; ctx.lineWidth = 2;
    NODES.forEach(n => {
      if (!n.parent_id || !pos[n.parent_id] || !pos[n.id]) return;
      const p = pos[n.parent_id], c = pos[n.id];
      const pcx = p.x + NODE_W / 2, pby = p.y + NODE_H, ccx = c.x + NODE_W / 2, cty = c.y, midY = pby + GAP_Y / 2;
      ctx.beginPath(); ctx.moveTo(pcx, pby); ctx.lineTo(pcx, midY); ctx.lineTo(ccx, midY); ctx.lineTo(ccx, cty); ctx.stroke();
    });
    const imgs = {};
    await Promise.all(NODES.filter(n => n.foto).map(n => new Promise(r => {
      const im = new Image(); im.onload = () => { imgs[n.id] = im; r(); }; im.onerror = () => r(); im.src = n.foto;
    })));
    NODES.forEach(n => { const p = pos[n.id]; if (p) drawCard(ctx, n, p.x, p.y, imgs[n.id]); });
    const a = document.createElement('a'); a.href = cv.toDataURL('image/png'); a.download = 'organograma.png'; a.click();
  } catch (e) { alert('Falha ao gerar PNG: ' + (e.message || e)); }
  finally { btn.textContent = t; btn.disabled = false; }
}
$('btn-png').addEventListener('click', exportarPNG);

function normNome(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/\s+/g, ' ').trim(); }
async function autoVincular() {
  let n = 0; const ups = [];
  CUSTOS.filter(r => !r.node_id).forEach(r => {
    const cn = normNome(r.nome); if (!cn) return;
    const m = NODES.find(nd => {
      const nn = normNome(nd.nome); if (!nn) return false;
      if (cn === nn || cn.startsWith(nn + ' ') || nn.startsWith(cn + ' ')) return true;
      const a = cn.split(' '), b = nn.split(' ');
      return a[0] === b[0] && a[a.length - 1] === b[b.length - 1];
    });
    if (m) { r.node_id = m.id; ups.push(r); n++; }
  });
  for (const r of ups) await SBC.from('org_custos').update({ node_id: r.node_id }).eq('id', r.id);
  renderCustos();
  alert(n ? `${n} pessoa(s) vinculada(s) por nome. Confira e ajuste o que faltar na coluna "Caixa no organograma".` : 'Nenhuma correspondência automática. Vincule manualmente na coluna "Caixa no organograma".');
}

}

  const rows = CUSTOS.slice().sort((a, b) => (a.ordem - b.ordem));

  const q = s => `"${String(s == null ? '' : s).replace(/"/g, '""')}"`;
  const lines = [head.map(q).join(';')];
  rows.forEach(r => { const c = calcRow(r); const nd = NODES.find(n => n.id === r.node_id); lines.push([r.nome, r.vinculo, r.area || '', r.funcao || '', r.status || '', Number(r.remuneracao || 0).toFixed(2), (c.pct * 100).toFixed(0) + '%', c.enc.toFixed(2), c.mes.toFixed(2), c.ano.toFixed(2), nd ? nd.nome : ''].map(q).join(';')); });

(async () => {
  const { data: { session } } = await SBC.auth.getSession();
  if (session && session.user && await loadSession(session.user)) startApp();
  else show('authView');
  SBC.auth.onAuthStateChange((_e, s) => { if (!s) show('authView'); });
})();
</script>
